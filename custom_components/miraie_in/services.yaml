send_mqtt_payload:
  name: Send Custom MQTT Payload
  description: Sends a raw JSON dictionary command payload directly over the authenticated MirAIe MQTT broker to the target AC unit.
  fields:
    payload:
      name: Payload
      description: 'JSON payload dictionary to transmit (e.g. {"bzr": "off", "ki": 1, "cnt": "an", "sid": "1"}).'
      required: true
      example:
        bzr: "off"
        ki: 1
        cnt: "an"
        sid: "1"
      selector:
        object:
    entity_id:
      name: Target Entity
      description: The climate entity to send the payload to (e.g. climate.room_2_room_2_ac).
      required: false
      example: climate.room_2_room_2_ac
      selector:
        entity:
          domain: climate
          integration: miraie_in
    device_id:
      name: Device ID
      description: Target Panasonic device ID (optional if entity_id is specified).
      required: false
      example: 8c53afca6252
      selector:
        text:
